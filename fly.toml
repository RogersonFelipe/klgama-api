# fly.toml app configuration file generated for klgama-api on 2026-06-03T21:55:59Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'klgama-api'
primary_region = 'gru'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
